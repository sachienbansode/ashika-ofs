<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFS QA console — sign in</title>
<link rel="stylesheet" href="/assets/qa.css">
</head>
<body class="door">
  <form class="card" id="f" autocomplete="off">
    <h1>OFS QA console</h1>
    <p class="sub">Front-end test runs. Separate from the OFS desk.</p>

    <div style="margin-bottom:12px">
      <label for="u">User</label>
      <input id="u" name="user" autocomplete="username" autofocus>
    </div>
    <div style="margin-bottom:16px">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password">
    </div>

    <button class="btn go" style="width:100%" id="go">Sign in</button>
    <div class="note bad hide" id="err" style="margin-top:12px"></div>
  </form>

<script>
var f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async function (e) {
  e.preventDefault();
  err.classList.add('hide');
  go.disabled = true; go.textContent = 'Signing in…';
  try {
    var r = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: document.getElementById('u').value,
                             password: document.getElementById('p').value })
    });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.message || 'Could not sign in.');
    location.href = '/';
  } catch (e2) {
    err.textContent = e2.message;
    err.classList.remove('hide');
    go.disabled = false; go.textContent = 'Sign in';
    document.getElementById('p').select();
  }
});
</script>
</body>
</html>
