# /etc/nginx/sites-available/ofs.conf
#
# ofs-bids.ashikagroup.com -> 127.0.0.1:4011 (PM2: ashika-ofs-app)
#
# Its OWN server block. The OFS app is not co-hosted under staging-api-app: a
# config change for one app must never be able to take the other down, and the
# rate-limit zones below are sized for a bidding window, not for an API portal.
#
# Install, then get the certificate:
#   sudo cp deploy/nginx/ofs.conf /etc/nginx/sites-available/ofs.conf
#   sudo ln -sf /etc/nginx/sites-available/ofs.conf /etc/nginx/sites-enabled/ofs.conf
#   sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/ofs-ip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ofs-bids.ashikagroup.com
#
# Certbot rewrites this file in place: it adds the 443 listener, the certificate
# paths, and a 301 from 80. Everything below survives that rewrite.

# Rate-limit zones. The app rate-limits internally too; this is the outer wall, so
# a flood never reaches Node at all.
limit_req_zone $binary_remote_addr zone=ofs_api:10m   rate=20r/s;   # normal API traffic
limit_req_zone $binary_remote_addr zone=ofs_auth:10m  rate=1r/s;    # sign-in + OTP

server {
    listen 80;
    listen [::]:80;
    server_name ofs-bids.ashikagroup.com;

    # Kept even after certbot adds its redirect: a renewal must always be able to
    # answer on port 80 without a rule sending it to 443 first.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The desk polls /api/dashboard every 5s during a bidding window.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # Sign-in and one-time codes: the endpoints worth guessing at.
    location ~ ^/(auth|client/auth)/ {
        limit_req zone=ofs_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=ofs_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # exchange-file generation on a large book
    }

    # /desk moved to /backoffice; the app answers the old path with a 301, so nothing
    # is needed here. Left as a note so nobody "helpfully" adds a duplicate rewrite.

    # Health checks: no rate limit, no access log — they run every minute.
    location = /healthz { proxy_pass http://127.0.0.1:4011; access_log off; }
    location = /readyz  { proxy_pass http://127.0.0.1:4011; access_log off; }

    # Exchange files can be a few MB; bid/margin CSV imports are posted as JSON.
    client_max_body_size 8m;

    # helmet sets CSP, X-Frame-Options and HSTS in the app (HSTS switches itself on
    # when FORCE_HTTPS=true), so nothing is added here that would end up duplicated.
    server_tokens off;

    access_log /var/log/nginx/ofs.access.log;
    error_log  /var/log/nginx/ofs.error.log;
}
