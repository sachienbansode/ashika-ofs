# /etc/nginx/sites-available/ofs.conf
# Own server block — the OFS app is NOT co-hosted under staging-api-app.
# Replace ofs.ashikagroup.com throughout, then:
#   sudo ln -s /etc/nginx/sites-available/ofs.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot AFTER this file is in place and port 80 works:
#   sudo certbot --nginx -d ofs.ashikagroup.com
# Certbot rewrites the listen directives and fills in the ssl_certificate paths.

# Rate-limit zone for auth-ish endpoints; the app also rate-limits internally.
limit_req_zone $binary_remote_addr zone=ofs_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ofs.ashikagroup.com;

    # Certbot adds its own redirect once TLS is issued; until then this block
    # serves the ACME challenge and the app.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # The desk polls /api/dashboard every 5s during a bidding window.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    location /api/ {
        limit_req zone=ofs_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # exchange-file generation on a large book
    }

    # Exchange files can be a few MB; bid/margin CSV imports are posted as JSON.
    client_max_body_size 8m;

    # The app sets CSP, X-Frame-Options etc. via helmet; add HSTS only after TLS
    # is confirmed working (certbot will not add it for you).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/ofs.access.log;
    error_log  /var/log/nginx/ofs.error.log;
}
