# /etc/nginx/sites-available/ofs.conf  — IP-only variant (no domain, no TLS)
#
# Use this to get the desk reachable at http://<vm-public-ip>/ before DNS and a
# certificate exist. Swap to deploy/nginx/ofs.conf once you have a domain.
#
#   sudo cp deploy/nginx/ofs-ip.conf /etc/nginx/sites-available/ofs.conf
#   sudo ln -s /etc/nginx/sites-available/ofs.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠ NO TLS HERE. The staff JWT and any unmasked client PII cross the network in
# clear text. Acceptable for internal testing from known addresses; not acceptable
# for the desk placing real bids. Restrict the Azure NSG to your office/VPN range
# rather than 0.0.0.0/0, and move to the TLS config before go-live.

limit_req_zone $binary_remote_addr zone=ofs_api_ip:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                      # answers on the IP, whatever it is

    location / {
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    location /api/ {
        limit_req zone=ofs_api_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    client_max_body_size 8m;

    access_log /var/log/nginx/ofs.access.log;
    error_log  /var/log/nginx/ofs.error.log;
}
